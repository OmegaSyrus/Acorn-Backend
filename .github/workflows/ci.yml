name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.3.3
      - name: Contract samples
        run: python3 -I tools/check_contract.py
      - name: Type check and generated contract
        run: deno task check
      - name: Row-level security
        run: |
          DB=postgresql://postgres:postgres@localhost:5432
          psql $DB -c "create database rls"
          for f in tests/sql/supabase_shim.sql supabase/migrations/*.sql tests/sql/rls_test.sql; do
            psql "$DB/rls" -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: API tests
        run: deno task test
